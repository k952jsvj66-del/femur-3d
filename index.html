<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ostéoscope iPad</title><style>
body{margin:0;background:#101b2b;color:#edf4ff;font:14px -apple-system,Arial}header{padding:15px;background:#1b2d46;font-size:20px;font-weight:bold}main{display:grid;grid-template-columns:1fr 310px;gap:10px;padding:10px}.panel{background:#1b2d46;border-radius:12px;overflow:hidden}canvas{width:100%;height:72vh;min-height:380px;display:block;touch-action:none}aside{padding:15px}button,select{background:#2c476a;border:1px solid #6585a8;color:white;padding:9px;border-radius:8px;margin:3px}select,input{width:100%}label{display:block;margin-top:12px}#info{background:#102035;border-radius:9px;padding:12px;line-height:1.55;margin-top:12px}footer{padding:10px;color:#b6c7d9;font-size:11px}@media(max-width:750px){main{display:block}canvas{height:50vh;min-height:340px}aside{margin-top:10px}}</style></head><body><header>OSTÉOSCOPE — Fémur interactif · iPad</header><main><div class="panel"><canvas id="v"></canvas></div><aside class="panel"><button id="reset">Réinitialiser</button><button id="plus">Zoom +</button><button id="minus">Zoom −</button><label>Vue anatomique</label><select id="mode"><option value="full">Fémur entier</option><option value="sag">Coupe sagittale</option><option value="front">Coupe frontale</option><option value="trans">Coupe transversale</option><option value="micro">Ostéon : microstructure</option><option value="trab">Travées et moelle</option></select><label>Transparence : <span id="ov">0%</span></label><input id="opacity" type="range" min="0" max="95" value="0"><label>Position de coupe : <span id="cv">50%</span></label><input id="cut" type="range" min="10" max="90" value="50"><p>Explorer les tissus et cellules :</p><div id="buttons"></div><div id="info"></div></aside></main><footer>Modèle pédagogique schématique, non issu d'une imagerie réelle. Sources : OpenStax Anatomy & Physiology 2e, chapitre 6 ; Histology Guide, Bone, Cartilage, Bone Marrow.</footer><script>
(()=>{'use strict';
const c=document.getElementById('v'),g=c.getContext('2d'),m=document.getElementById('mode'),op=document.getElementById('opacity'),cut=document.getElementById('cut'),info=document.getElementById('info');let w,h,z=1,ang=.3,drag=null;
const facts={
'Périoste':['Membrane conjonctive vascularisée recouvrant l’os hors cartilage articulaire.','Fibroblastes, cellules ostéoprogénitrices, ostéoblastes selon activité.','Le cartilage articulaire ne possède pas de périoste.'],
'Os compact':['Cortex lamellaire avec ostéons, lamelles, canaux de Havers et de Volkmann.','Ostéocytes dans les lacunes ; ostéoblastes et ostéoclastes sur les surfaces actives.','Les canaux de Havers sont surtout longitudinaux.'],
'Endoste':['Fine couche tapissant cavité médullaire et surfaces osseuses internes.','Cellules bordantes, ostéoprogénitrices, ostéoblastes et ostéoclastes.','Endoste = interne ; périoste = externe.'],
'Moelle':['La cavité diaphysaire adulte contient surtout de la moelle jaune ; la moelle rouge est notamment présente dans certaines régions spongieuses.','Adipocytes, cellules stromales, endothéliales et macrophages ; dans la moelle rouge, précurseurs sanguins et mégacaryocytes.','Répartition variable selon l’âge.'],
'Os spongieux':['Réseau de travées osseuses lamellaires entourant des espaces médullaires.','Ostéocytes dans les travées ; ostéoblastes et ostéoclastes en surface.','Pas d’ostéons complets dans la plupart des travées normales.'],
'Cartilage':['Cartilage hyalin articulaire, avasculaire, sur la tête et les condyles.','Chondrocytes dans leurs lacunes, matrice riche en collagène II et protéoglycanes.','Pas de périchondre sur le cartilage articulaire.'],
'Ostéocyte':['Cellule osseuse mature située dans une lacune de la matrice.','Prolongements dans les canalicules ; rôle de mécanodétection.','Ne réside pas dans la lumière du canal de Havers.'],
'Ostéoblaste':['Cellule mononucléée qui sécrète l’ostéoïde.','Réticulum endoplasmique rugueux et Golgi développés.','Ostéoïde initialement non minéralisé.'],
'Ostéoclaste':['Grande cellule multinucléée issue de la lignée monocyte/macrophage, résorbant l’os.','Bordure plissée, zone de scellement, lacune de Howship.','Ostéoclaste résorbe ; ostéoblaste forme.']};
function show(k){let f=facts[k];info.innerHTML='<b>'+k+'</b><p>'+f[0]+'</p><p><b>Cellules / détails :</b> '+f[1]+'</p><p><b>Piège PASS :</b> '+f[2]+'</p>'}
Object.keys(facts).forEach(k=>{let b=document.createElement('button');b.textContent=k;b.onclick=()=>{show(k);if(k==='Os spongieux')m.value='trab';if(['Ostéocyte','Ostéoblaste','Ostéoclaste'].includes(k))m.value='micro';draw()};document.getElementById('buttons').append(b)});
function el(x,y,a,b,fill){g.beginPath();g.ellipse(x,y,Math.max(1,a),Math.max(1,b),0,0,7);g.fillStyle=fill;g.fill();g.strokeStyle='#f1ddae';g.lineWidth=1.3;g.stroke()}
function ln(x,y,X,Y,color='#d2c19d',width=2){g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.strokeStyle=color;g.lineWidth=width;g.stroke()}
function txt(s,x,y){g.fillStyle='#fff';g.font='12px -apple-system,Arial';g.fillText(s,x,y)}
function polygon(p,fill){g.beginPath();p.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fillStyle=fill;g.fill();g.strokeStyle='#e9d6b2';g.stroke()}
function bone(){let cx=w/2,cy=h/2,L=Math.min(h*.37,200)*z,ps=[],qs=[];for(let i=0;i<=80;i++){let t=-1+i/40,r=(21+9*Math.pow(Math.abs(t),6)+18*Math.pow(Math.max(0,Math.abs(t)-.7)/.3,2))*z,x=cx+Math.sin(t*2)*11*z,y=cy+t*L;ps.push([x-r*Math.cos(ang),y]);qs.push([x+r*Math.cos(ang),y])}let outline=[...ps,...qs.reverse()];polygon(outline,'#b59c77');if(m.value!=='full'||op.value>0){let a=[],b=[];for(let i=9;i<72;i++){let t=-1+i/40,y=cy+t*L,x=cx+Math.sin(t*2)*11*z;a.push([x-11*z,y]);b.push([x+11*z,y])}polygon([...a,...b.reverse()],'#a86b43');for(let i=0;i<35;i++){let t=-.78+i*.045;el(cx+Math.sin(i*5)*7*z,cy+t*L,2*z,3*z,i%3?'#f0bd78':'#e2d59a')}}g.globalAlpha=1-op.value/100;polygon(outline,'#e2d2b0');g.globalAlpha=1;
let hx=cx-42*z*Math.cos(ang),hy=cy-L+12*z;ln(hx,hy,cx,cy-L+48*z,'#d9c9a9',22*z);el(hx,hy,25*z,25*z,'#e8d9b7');el(cx+23*z,cy-L+23*z,18*z,23*z,'#c7b18d');el(cx-22*z,cy+L,24*z,18*z,'#d9c5a2');el(cx+22*z,cy+L,24*z,18*z,'#d9c5a2');
if(m.value==='trans'){let y=cy+(cut.value/100-.5)*L*1.5;el(cx,y,75*z,48*z,'#e3cfa9');el(cx,y,46*z,28*z,'#ad724b');txt('Coupe de la diaphyse',cx-65*z,y-55*z)}else if(m.value!=='full'){let x=cx+(cut.value/100-.5)*80*z;ln(x,cy-L,x,cy+L,'#78ceff',2)}txt('Tête fémorale',hx-38*z,hy-33*z);txt('Diaphyse',cx+43*z,cy);txt('Condyles',cx+45*z,cy+L+20*z)}
function micro(){let cx=w/2,cy=h/2,r=Math.min(w*.34,h*.34)*z;for(let i=0;i<6;i++)el(cx,cy,r*(1-i*.15),r*(.75-i*.11),i%2?'#c6aa7e':'#a88d67');el(cx,cy,r*.12,r*.1,'#98424b');for(let i=0;i<28;i++){let a=i*2.4,R=r*(.2+(i%4)*.16),x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R*.75;el(x,y,3*z,2*z,'#3e6983');ln(x,y,x+Math.cos(a)*8*z,y+Math.sin(a)*8*z,'#7aafc6',1)}txt('Canal de Havers',cx+15,cy-8);txt('Lamelles concentriques',cx-r,cy-r*.85);txt('Lacunes et canalicules',cx-r,cy+r*.85)}
function trab(){let cx=w/2,cy=h/2,r=Math.min(w*.4,h*.37)*z;el(cx,cy,r,r*.85,'#aa5654');for(let i=0;i<12;i++){let a=i*2.4,x=cx+Math.cos(a)*r*.7,y=cy+Math.sin(a)*r*.6;ln(cx,cy,x,y,'#eddbb2',10*z);el(x,y,9*z,8*z,'#eddbb2')}for(let i=0;i<40;i++){let a=i*2.4,R=r*(.15+((i*17)%39)/50);el(cx+Math.cos(a)*R,cy+Math.sin(a)*R*.8,3*z,3*z,i%4?'#ed9999':'#f1d28d')}txt('Travées osseuses',cx-r*.8,cy-r*.9);txt('Moelle',cx-r*.8,cy+r*.95)}
function draw(){let d=Math.min(devicePixelRatio||1,2),r=c.getBoundingClientRect();w=r.width;h=r.height;c.width=Math.round(w*d);c.height=Math.round(h*d);g.setTransform(d,0,0,d,0,0);let bg=g.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.max(w,h));bg.addColorStop(0,'#294561');bg.addColorStop(1,'#0b1524');g.fillStyle=bg;g.fillRect(0,0,w,h);if(m.value==='micro')micro();else if(m.value==='trab')trab();else bone();document.getElementById('ov').textContent=op.value+'%';document.getElementById('cv').textContent=cut.value+'%'}
[m,op,cut].forEach(e=>e.oninput=draw);document.getElementById('reset').onclick=()=>{z=1;ang=.3;m.value='full';op.value=0;cut.value=50;draw()};document.getElementById('plus').onclick=()=>{z=Math.min(2.5,z*1.2);draw()};document.getElementById('minus').onclick=()=>{z=Math.max(.5,z/1.2);draw()};c.onpointerdown=e=>{drag=e.clientX;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(drag===null)return;ang+=(e.clientX-drag)*.01;drag=e.clientX;draw()};c.onpointerup=()=>drag=null;c.addEventListener('wheel',e=>{e.preventDefault();z=Math.max(.5,Math.min(3,z*(e.deltaY>0?.9:1.1)));draw()},{passive:false});let dist=null;c.addEventListener('touchstart',e=>{if(e.touches.length===2)dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});c.addEventListener('touchmove',e=>{if(e.touches.length===2&&dist){let n=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);z=Math.max(.5,Math.min(3,z*n/dist));dist=n;draw()}},{passive:true});c.addEventListener('touchend',()=>dist=null);window.onresize=draw;show('Os compact');draw()})();
</script></body></html>
